version: '3'

services:
  postgresql:
    image: postgres:15
    container_name: postgresql
    restart: always
    # ports:
    #   - 5432:5432
    environment:
      - ../env/postgresql.env
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE}"]
      interval: 5s
      retries: 10

  redis:
    image: bitnami/redis:latest
    container_name: redis
    restart: always
    # ports:
    #   - 6379:6379
    env_file:
      - ../env/redis.env
    volumes:
      - redis-data:/bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  
  aris-mem-db-migrate:
    image: ghcr.io/hcd233/aris-mem-api:master
    container_name: aris-mem-db-migrate
    restart: no
    env_file:
      - ../env/api.env
    depends_on:
      postgresql:
        condition: service_healthy
    command: ["/app/aris-mem-api", "database", "migrate"]

  aris-mem-api:
    image: ghcr.io/hcd233/aris-mem-api:master
    container_name: aris-mem-api
    restart: always
    ports:
      - 9080:8080
    env_file:
      - ../env/api.env
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      aris-mem-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:${PORT}"]
      interval: 10s
      timeout: 5s
      retries: 5

    command: ["/app/aris-mem-api", "server", "start", "--host", "0.0.0.0", "--port", "${PORT}"]

volumes:
  postgresql-data:
    name: postgresql-data
    external: true
  redis-data:
    name: redis-data
    external: true

